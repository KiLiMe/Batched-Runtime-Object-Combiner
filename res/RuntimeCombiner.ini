; Runtime Combiner: combines static references into batched meshes at run time, a runtime replacement for the
; precombined meshes (precombines). Log: Documents\My Games\Fallout4\F4SE\RuntimeCombiner.log

[General]
bEnabled=1
; Switch the engine's precombines off at startup (bUseCombinedObjects), so every static loads its own 3D and is
; combined here. 0 keeps them as configured; then only references outside the precombines are combined.
bDisablePrecombines=1
; 0 = dry run: collect and bake, log the numbers, change nothing in the scene.
bApply=1
; Virtual-key code (decimal) of the on/off switch for A/B comparisons: 114 = F3. 0 = unbound.
iToggleHotkey=114
; HUD notice when the switch is used.
bNotify=1

[Combine]
; Grid cell size (game units) that groups a cell's meshes into one combined mesh. Larger = fewer draws, coarser culling.
fChunkSize=1024.0
; Meshes with a bigger bound radius stay as they are.
fMaxShapeRadius=2048.0
; A combined mesh must replace at least this many meshes.
iMinShapesPerChunk=2
; Frames without 3D changes in a cell before it is (re)combined.
iSettleFrames=45
; Main-thread time per frame for collecting cells (ms).
fGatherBudgetMs=2.0
; 1 = each combined mesh hangs under its own fade node with its originals' fade range: it fades in after a
; load and fades out at a distance where they would. 0 = straight in its container (no fade).
bChunkFadeNodes=1

[Debug]
; One log line per combined cell.
bLogCells=1
; Combined references re-checked per frame (moved, disabled, unloaded or re-shown originals).
iWatchdogRefsPerFrame=512
